openapi: 3.0.3
info:
  title: PB Ledger API
  version: 1.0.0
  description: 家計簿 (予算と支出)、資産管理 (口座・現金・金融資産の残高)、クレジットカードの利用額を扱う REST API。認証は Bearer
    のアクセストークンで、リフレッシュトークンは HttpOnly Cookie に置く。
paths:
  /api/accounts/me/:
    get:
      operationId: accountsMeRetrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
          description: ''
  /api/auth/login/:
    post:
      operationId: authLoginCreate
      description: access を JSON で返し、refresh は HttpOnly Cookie に保存する。
      summary: ログイン
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/auth/logout/:
    post:
      operationId: authLogoutCreate
      description: refresh を失効させ Cookie を削除する。
      summary: ログアウト
      tags:
      - auth
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: authRefreshCreate
      description: Cookie の refresh を使う。Origin ヘッダが設定値と一致する場合のみ受け付ける。
      summary: アクセストークンを再発行
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/budgets/:
    post:
      operationId: householdBudgetsCreate
      summary: カテゴリ予算を登録
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/budgets/{budgetId}/:
    patch:
      operationId: householdBudgetsPartialUpdate
      summary: カテゴリ予算を更新
      parameters:
      - in: path
        name: budgetId
        schema:
          type: integer
        required: true
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudgetPatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBudgetPatchInRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
    delete:
      operationId: householdBudgetsDestroy
      summary: カテゴリ予算を削除
      parameters:
      - in: path
        name: budgetId
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/budgets/copy/:
    post:
      operationId: householdBudgetsCopyCreate
      description: 指定月の全カテゴリ予算をターゲット月に複製する。既存はスキップ。
      summary: 前月などの予算を別の月へ複製
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCopyInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetCopyInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCopyOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/budgets/period/total/:
    put:
      operationId: householdBudgetsPeriodTotalUpdate
      description: 月の総予算 (上限) を設定する。
      summary: 月の上限を設定
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodTotalInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PeriodTotalInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodTotalOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/budgets/summary/:
    get:
      operationId: householdBudgetsSummaryRetrieve
      summary: 月の予算と使用状況
      parameters:
      - in: query
        name: month
        schema:
          type: integer
        description: 対象月 (1〜12)。
      - in: query
        name: year
        schema:
          type: integer
        description: 対象年 (西暦)。
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummaryOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/categories/:
    get:
      operationId: householdCategoriesList
      summary: カテゴリの一覧
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryOut'
          description: ''
    post:
      operationId: householdCategoriesCreate
      summary: カテゴリを作成
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/categories/{categoryId}/:
    patch:
      operationId: householdCategoriesPartialUpdate
      summary: カテゴリを更新
      parameters:
      - in: path
        name: categoryId
        schema:
          type: integer
        required: true
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryInRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
    delete:
      operationId: householdCategoriesDestroy
      summary: カテゴリを削除
      parameters:
      - in: path
        name: categoryId
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/expenses/:
    get:
      operationId: householdExpensesList
      summary: 支出の一覧
      parameters:
      - in: query
        name: month
        schema:
          type: integer
        description: 対象月 (1〜12)。
      - in: query
        name: paymentAccountId
        schema:
          type: integer
        description: 支払元の決済手段 ID で絞り込む。
      - in: query
        name: sourceCashAdjustmentId
        schema:
          type: integer
        description: この現金入出金に紐付いた支出だけを返す。
      - in: query
        name: sourceTransactionId
        schema:
          type: integer
        description: この明細に紐付いた支出だけを返す。
      - in: query
        name: unlinkedOnly
        schema:
          type: boolean
        description: true なら明細にも現金入出金にも紐付いていない支出だけを返す。
      - in: query
        name: year
        schema:
          type: integer
        description: 対象年 (西暦)。
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
    post:
      operationId: householdExpensesCreate
      summary: 支出を登録
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCreatedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/expenses/{expenseId}/:
    patch:
      operationId: householdExpensesPartialUpdate
      summary: 支出を更新 (明細・現金入出金への紐付け変更を含む)
      parameters:
      - in: path
        name: expenseId
        schema:
          type: integer
        required: true
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExpensePatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpensePatchInRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseUpdatedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
    delete:
      operationId: householdExpensesDestroy
      summary: 支出を削除
      parameters:
      - in: path
        name: expenseId
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/expenses/summary/:
    get:
      operationId: householdExpensesSummaryRetrieve
      summary: 月のカテゴリ別支出
      parameters:
      - in: query
        name: month
        schema:
          type: integer
        description: 対象月 (1〜12)。
      - in: query
        name: year
        schema:
          type: integer
        description: 対象年 (西暦)。
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummaryOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOut'
          description: ''
  /api/household/expenses/years/:
    get:
      operationId: householdExpensesYearsRetrieve
      summary: 支出が存在する年の一覧
      tags:
      - household
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example:
                - 2025
                - 2026
          description: ''
  /api/ledger/accounts/:
    post:
      operationId: ledgerAccountsCreate
      summary: 口座・カード・現金・金融資産を作成
      tags:
      - ledger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/accounts/{accountId}/:
    patch:
      operationId: ledgerAccountsPartialUpdate
      summary: 口座の参照 URL を更新
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      - in: query
        name: assetKind
        schema:
          type: string
          enum:
          - bank_account
          - cash
          - credit_card
          - financial_asset
        description: 資産種別。
        required: true
      tags:
      - ledger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatchInRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPatchOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    delete:
      operationId: ledgerAccountsDestroy
      summary: 口座を削除 (明細とスナップショットも削除)
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      - in: query
        name: assetKind
        schema:
          type: string
          enum:
          - bank_account
          - cash
          - credit_card
          - financial_asset
        description: 資産種別。
        required: true
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/accounts/{accountId}/cash-history/:
    get:
      operationId: ledgerAccountsCashHistoryRetrieve
      description: 現金口座の入出履歴を Transfer / HouseholdExpense / CashAdjustment から統合して返す。
      summary: 現金口座の履歴 (振替・支出・入出金)
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: 対象月 (YYYY-MM)。省略時は当月。
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashHistoryOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/accounts/{accountId}/csv-templates/:
    get:
      operationId: ledgerAccountsCsvTemplatesRetrieve
      summary: 口座の CSV テンプレート
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvTemplateOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    post:
      operationId: ledgerAccountsCsvTemplatesCreate
      summary: CSV テンプレートを登録 (同時に明細の取込も可)
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      tags:
      - ledger
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvTemplateInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvTemplateCreatedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/accounts/{accountId}/transactions/:
    get:
      operationId: ledgerAccountsTransactionsRetrieve
      summary: 口座の明細一覧 (月指定)
      parameters:
      - in: path
        name: accountId
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 最大件数 (1〜200、既定 50)。
      - in: query
        name: month
        schema:
          type: string
        description: 対象月 (YYYY-MM)。省略時は当月。
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/accounts/upload-csv/:
    post:
      operationId: ledgerAccountsUploadCsvCreate
      summary: テンプレートに従って CSV を取り込む
      tags:
      - ledger
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvImportInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/assets/:
    get:
      operationId: ledgerAssetsRetrieve
      summary: 資産の一覧と前月比
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: 対象月 (YYYY-MM)。省略時は当月。
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
  /api/ledger/cash-adjustments/:
    get:
      operationId: ledgerCashAdjustmentsRetrieve
      summary: 現金の入出金一覧
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: 対象月 (YYYY-MM)。省略時は当月。
      - in: query
        name: paymentAccountId
        schema:
          type: integer
        description: 現金口座の ID で絞り込む。
      tags:
      - ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashAdjustmentsOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
    post:
