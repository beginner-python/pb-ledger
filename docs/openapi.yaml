components:
  schemas:
    AccessOut:
      type: object
      properties:
        access:
          type: string
          description: 再発行したアクセストークン
      required:
      - access
    AccountCreateInRequest:
      type: object
      properties:
        assetKind:
          enum:
          - bank_account
          - credit_card
          - cash
          - financial_asset
          type: string
          description: |-
            * `bank_account` - bank_account
            * `credit_card` - credit_card
            * `cash` - cash
            * `financial_asset` - financial_asset
          x-spec-enum-id: 7889c536b688f83f
        name:
          type: string
          minLength: 1
          maxLength: 100
        branchName:
          type: string
          minLength: 1
          description: 銀行口座のみ
        accountNumber:
          type: string
          minLength: 1
          description: 銀行口座のみ
        issuer:
          type: string
          minLength: 1
          description: カードのみ
        last4:
          type: string
          minLength: 1
          description: カードのみ
          maxLength: 4
        closingDay:
          type: integer
          maximum: 31
          minimum: 1
        paymentDay:
          type: integer
          maximum: 31
          minimum: 1
      required:
      - assetKind
      - name
    AccountDeleteOut:
      type: object
      properties:
        deleted:
          type: integer
        deletedTransactions:
          type: integer
        deletedSnapshots:
          type: integer
      required:
      - deleted
      - deletedSnapshots
      - deletedTransactions
    AccountPatchOut:
      type: object
      properties:
        accountId:
          type: integer
        referenceUrl:
          type: string
      required:
      - accountId
      - referenceUrl
    AssetAccountOut:
      type: object
      properties:
        assetKind:
          enum:
          - bank_account
          - credit_card
          - cash
          - financial_asset
          type: string
          description: |-
            * `bank_account` - bank_account
            * `credit_card` - credit_card
            * `cash` - cash
            * `financial_asset` - financial_asset
          x-spec-enum-id: 7889c536b688f83f
        accountId:
          type: integer
        accountName:
          type: string
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          description: カードは当月利用額
        previousBalance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        balanceChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        lastUpdated:
          type: string
          format: date
          nullable: true
        source:
          enum:
          - transaction
          - snapshot
          - computed
          - none
          type: string
          x-spec-enum-id: 2bc9ce5407abe96b
          description: |-
            残高の根拠。明細の残高列 / スナップショット / 動的計算 / 無し

            * `transaction` - transaction
            * `snapshot` - snapshot
            * `computed` - computed
            * `none` - none
        hasCsvTemplate:
          type: boolean
        csvTemplateId:
          type: integer
          nullable: true
        referenceUrl:
          type: string
      required:
      - accountId
      - accountName
      - assetKind
      - balance
      - balanceChange
      - csvTemplateId
      - hasCsvTemplate
      - lastUpdated
      - previousBalance
      - referenceUrl
      - source
    AssetsOut:
      type: object
      properties:
        totalAssets:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: 銀行 + 現金 + 金融資産 (カードは含めない)
        totalAssetsChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        bankAccountsTotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        bankAccountsTotalChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        creditCardsTotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        creditCardsTotalChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cashWalletsTotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cashWalletsTotalChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        financialAssetsTotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        financialAssetsTotalChange:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        previousMonthEnd:
          type: string
          format: date
        bankAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AssetAccountOut'
        creditCards:
          type: array
          items:
            $ref: '#/components/schemas/AssetAccountOut'
